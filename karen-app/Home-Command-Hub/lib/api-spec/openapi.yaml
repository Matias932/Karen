openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Karen - Smart Home Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: devices
    description: Smart home device management
  - name: command-logs
    description: Device command history
  - name: openai
    description: OpenAI AI chat and voice operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List all devices
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
    post:
      operationId: createDevice
      tags: [devices]
      summary: Add a new device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInput"
      responses:
        "201":
          description: Created device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /devices/{id}:
    get:
      operationId: getDevice
      tags: [devices]
      summary: Get a device by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateDevice
      tags: [devices]
      summary: Update a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDevice
      tags: [devices]
      summary: Delete a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /devices/{id}/command:
    post:
      operationId: sendDeviceCommand
      tags: [devices]
      summary: Send a command to a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCommandInput"
      responses:
        "200":
          description: Command result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCommandResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /devices/{id}/roku-apps:
    get:
      operationId: listRokuApps
      tags: [devices]
      summary: List installed Roku apps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of Roku apps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RokuApp"
        "400":
          description: Not a Roku device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /devices/{id}/status:
    get:
      operationId: getDeviceStatus
      tags: [devices]
      summary: Check if device is reachable online
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Device online status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /command-logs:
    get:
      operationId: listCommandLogs
      tags: [command-logs]
      summary: List recent command logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: deviceId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of command logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommandLog"

  /command-logs/stats:
    get:
      operationId: getCommandStats
      tags: [command-logs]
      summary: Get command execution statistics
      responses:
        "200":
          description: Command statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandStats"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all Karen conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Start a new conversation with Karen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get a conversation with its messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message to Karen (SSE streaming response)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /openai/conversations/{id}/voice-messages:
    post:
      operationId: sendOpenaiVoiceMessage
      tags: [openai]
      summary: Send a voice message to Karen — she transcribes, responds, and controls devices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiVoiceMessageInput"
      responses:
        "200":
          description: SSE stream with transcript, Karen response, audio, and device actions
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Device:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [roku, android_tv, ps5]
        ipAddress:
          type: string
        macAddress:
          type: ["string", "null"]
        port:
          type: ["integer", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - ipAddress
        - isActive
        - createdAt

    DeviceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [roku, android_tv, ps5]
        ipAddress:
          type: string
          minLength: 1
        macAddress:
          type: ["string", "null"]
        port:
          type: ["integer", "null"]
        isActive:
          type: boolean
          default: true
      required:
        - name
        - type
        - ipAddress

    DeviceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [roku, android_tv, ps5]
        ipAddress:
          type: string
        macAddress:
          type: ["string", "null"]
        port:
          type: ["integer", "null"]
        isActive:
          type: boolean

    DeviceCommandInput:
      type: object
      properties:
        command:
          type: string
          minLength: 1
          description: "Command: power_on, power_off, volume_up, volume_down, mute, unmute, home, back, play, pause, launch_app, wake"
        appId:
          type: ["string", "null"]
          description: App ID or package name for launch_app command
        appName:
          type: ["string", "null"]
          description: Human-readable app name for launch_app
      required:
        - command

    DeviceCommandResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        deviceName:
          type: string
      required:
        - success
        - message
        - deviceName

    RokuApp:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        version:
          type: ["string", "null"]
      required:
        - id
        - name
        - type

    DeviceStatus:
      type: object
      properties:
        deviceId:
          type: integer
        online:
          type: boolean
        lastChecked:
          type: string
          format: date-time
      required:
        - deviceId
        - online
        - lastChecked

    CommandLog:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: ["integer", "null"]
        deviceName:
          type: ["string", "null"]
        command:
          type: string
        status:
          type: string
          enum: [success, failed, pending]
        response:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - command
        - status
        - createdAt

    DeviceStatEntry:
      type: object
      properties:
        deviceName:
          type: string
        count:
          type: integer
      required:
        - deviceName
        - count

    CommandStats:
      type: object
      properties:
        total:
          type: integer
        successful:
          type: integer
        failed:
          type: integer
        byDevice:
          type: array
          items:
            $ref: "#/components/schemas/DeviceStatEntry"
      required:
        - total
        - successful
        - failed
        - byDevice

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiVoiceMessageInput:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded audio data (WebM or any OpenAI-supported format)
      required:
        - audio

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
